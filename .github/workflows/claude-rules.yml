name: CLAUDE.md Rules

on:
  pull_request:
    branches: [main, develop]

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

  structural-rules:
    name: Reglas estructurales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar convenciones de nombres
        run: |
          ERRORS=0

          # Models deben tener prefijo I (ej: IOrder.ts)
          echo "── Verificando models/ ──"
          while IFS= read -r file; do
            base=$(basename "$file")
            if [[ ! "$base" =~ ^I[A-Z] ]]; then
              echo "❌ models/$base debe tener prefijo I (ej: IOrder.ts)"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find resources/js/models -name "*.ts" -not -name "index.ts" 2>/dev/null)

          # Services deben tener prefijo use (ej: useOrderService.ts)
          echo "── Verificando services/ ──"
          while IFS= read -r file; do
            base=$(basename "$file")
            if [[ ! "$base" =~ ^use ]]; then
              echo "❌ services/$base debe tener prefijo use (ej: useOrderService.ts)"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find resources/js/services -name "*.ts" 2>/dev/null)

          # Hooks deben tener prefijo use
          echo "── Verificando hooks/ ──"
          while IFS= read -r file; do
            base=$(basename "$file")
            if [[ ! "$base" =~ ^use ]]; then
              echo "❌ hooks/$base debe tener prefijo use (ej: useModal.ts)"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find resources/js/hooks -name "*.ts" -not -name "index.ts" 2>/dev/null)

          echo ""
          if [ $ERRORS -gt 0 ]; then
            echo "❌ $ERRORS violación(es) de convenciones de nombres (CLAUDE.md)"
            exit 1
          else
            echo "✅ Convenciones de nombres correctas"
          fi

      - name: Verificar que no hay peticiones directas a axios en pages/ y components/
        run: |
          ERRORS=0
          echo "── Verificando peticiones HTTP directas ──"

          # Buscar imports de axios fuera de configs/ y contexts/
          while IFS= read -r file; do
            if grep -qE "^import axios|from ['\"]axios['\"]" "$file" 2>/dev/null; then
              echo "❌ $file importa axios directamente. Usa useAxios() o el servicio (CLAUDE.md: peticiones http)"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find resources/js/pages resources/js/components -name "*.ts" -o -name "*.tsx" 2>/dev/null)

          # Buscar llamadas crudas a axiosPOST/axiosPUT/axiosDELETE/axiosGET/axiosApi.<metodo>
          # directamente en hooks de pages/ o components/ — deben vivir en services/*.ts
          while IFS= read -r file; do
            if grep -qE "axios(POST|PUT|DELETE|GET|PATCH)\(|axiosApi\.(get|post|put|delete|patch)\(" "$file" 2>/dev/null; then
              echo "❌ $file llama axios*() o axiosApi crudo directamente. Muévelo a un hook en services/*.ts (CLAUDE.md: peticiones http)"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find resources/js/pages resources/js/components -name "*.ts" -o -name "*.tsx" 2>/dev/null)

          if [ $ERRORS -gt 0 ]; then
            exit 1
          else
            echo "✅ Sin peticiones HTTP directas"
          fi

      - name: Verificar que no hay modelos definidos en pages/ o components/
        run: |
          ERRORS=0
          echo "── Verificando definición de interfaces ──"

          # Buscar interfaces con prefijo I definidas dentro de pages/ o components/
          while IFS= read -r file; do
            count=$(grep -cE "^export interface I[A-Z]" "$file" 2>/dev/null || true)
            if [ "$count" -gt 0 ]; then
              echo "❌ $file define $count interfaz(ces) de dominio. Muévelas a models/ (CLAUDE.md: Tipos)"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find resources/js/pages resources/js/components -name "*.ts" -o -name "*.tsx" 2>/dev/null)

          if [ $ERRORS -gt 0 ]; then
            exit 1
          else
            echo "✅ Interfaces de dominio en models/"
          fi

      - name: Verificar que no hay inline styles
        run: |
          echo "── Verificando inline styles ──"

          # Excluir el caso válido de scrollbarWidth (CategoryFilter) y casos de color picker
          MATCHES=$(grep -rn "style={{" resources/js/pages resources/js/components \
            --include="*.tsx" \
            | grep -v "scrollbarWidth\|msOverflowStyle" \
            | grep -v "backgroundColor.*color" || true)

          if [ -n "$MATCHES" ]; then
            echo "⚠️  Posible uso de inline style (CLAUDE.md: Estilos):"
            echo "$MATCHES"
            echo ""
            echo "Usa clases de Tailwind en lugar de style={{}}."
            # Warning, no bloquea el PR
          else
            echo "✅ Sin inline styles detectados"
          fi

      - name: Verificar tamaño de componentes de página
        run: |
          echo "── Verificando tamaño de <FeaturePage>.tsx ──"
          MAX_LINES=150
          FOUND=0

          # Solo el componente principal de cada página (pages/<Feature>/<Page>.tsx,
          # incluyendo pages/SuperAdmin/<Feature>/<Page>.tsx). Excluye partials/ (se
          # espera que sean piezas pequeñas) y hooks use*.tsx.
          while IFS= read -r file; do
            lines=$(wc -l < "$file" | tr -d ' ')
            if [ "$lines" -gt "$MAX_LINES" ]; then
              echo "⚠️  $file tiene $lines líneas (límite sugerido: $MAX_LINES)"
              FOUND=$((FOUND + 1))
            fi
          done < <(find resources/js/pages -name "*.tsx" ! -iname "use*" | grep -v "/partials/")

          if [ "$FOUND" -gt 0 ]; then
            echo ""
            echo "Considera dividir en partials/ (CLAUDE.md: 'Cuándo dividir un componente de página en partials/')."
            # Warning, no bloquea el PR — es una señal, no todos los casos ameritan split inmediato.
          else
            echo "✅ Todas las páginas dentro del límite sugerido"
          fi

      - name: Verificar carpetas con muchos archivos sueltos (candidatas a reorganizar)
        run: |
          echo "── Verificando organización por funcionalidad (CLAUDE.md: 'Organización de partials/') ──"
          MAX_FILES=6
          FOUND=0

          check_dir() {
            local dir="$1"
            count=$(find "$dir" -maxdepth 1 -type f \( -name "*.tsx" -o -name "*.ts" \) | wc -l | tr -d ' ')
            if [ "$count" -gt "$MAX_FILES" ]; then
              echo "⚠️  $dir tiene $count archivos sueltos (límite sugerido: $MAX_FILES)"
              FOUND=$((FOUND + 1))
            fi
          }

          # Carpetas partials/ de cada página y sus subcarpetas de grupo (ej. partials/Cart/)
          while IFS= read -r dir; do
            check_dir "$dir"
          done < <(find resources/js/pages -type d -path "*/partials*" 2>/dev/null)

          # Todo el árbol de components/ (módulos reutilizables y sus subcarpetas)
          while IFS= read -r dir; do
            check_dir "$dir"
          done < <(find resources/js/components -type d 2>/dev/null)

          if [ "$FOUND" -gt 0 ]; then
            echo ""
            echo "Agrupa por sub-funcionalidad en subcarpetas si tiene sentido (CLAUDE.md: 'Organización de partials/')."
            echo "No todos los casos ameritan split — carpetas de una sola funcionalidad cohesiva (ej. un modal con sus piezas) pueden quedarse así."
            # Warning, no bloquea el PR — es una señal para revisión humana, no una regla dura.
          else
            echo "✅ Sin carpetas con exceso de archivos sueltos"
          fi

      - name: Verificar que components/ no consume contexto de página
        run: |
          ERRORS=0
          echo "── Verificando aislamiento de components/ (CLAUDE.md: 'Contextos: globales vs. de página') ──"

          # components/ es global y debe recibir todo por props — no puede importar el
          # contexto de una página específica (pages/<Feature>/<Feature>Context.tsx),
          # eso lo ataría a esa página y rompería su portabilidad/testeabilidad aislada.
          while IFS= read -r file; do
            if grep -qE "from [\"']@/pages/[^\"']*Context[\"']" "$file" 2>/dev/null; then
              echo "❌ $file importa un contexto de página (@/pages/.../*Context). components/ debe recibir todo por props (CLAUDE.md: 'Contextos: globales vs. de página')"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find resources/js/components -name "*.tsx" -o -name "*.ts" 2>/dev/null)

          if [ $ERRORS -gt 0 ]; then
            exit 1
          else
            echo "✅ components/ no consume contexto de página"
          fi

      - name: Verificar que los Context de página vivan en la raíz de pages/<Feature>/
        run: |
          ERRORS=0
          echo "── Verificando ubicación de *Context.tsx (CLAUDE.md: 'Contextos: globales vs. de página') ──"

          # <Feature>Context.tsx debe vivir junto al hook de la página (pages/<Feature>/),
          # no dentro de partials/ — ahí es donde los partials lo consumen, no donde vive.
          while IFS= read -r file; do
            echo "❌ $file — un *Context.tsx de página debe vivir en pages/<Feature>/, no dentro de partials/"
            ERRORS=$((ERRORS + 1))
          done < <(find resources/js/pages -iname "*Context.tsx" -path "*/partials/*" 2>/dev/null)

          if [ $ERRORS -gt 0 ]; then
            exit 1
          else
            echo "✅ Contextos de página bien ubicados"
          fi

      - name: Verificar tamaño del hook principal de página
        run: |
          echo "── Verificando tamaño de use<Feature>Page.ts (CLAUDE.md: 'Cuándo dividir un hook') ──"
          MAX_LINES=80
          FOUND=0

          # Solo el hook principal de cada página (pages/<Feature>/use<Feature>Page.ts),
          # no sus sub-hooks de dominio (esos ya viven divididos y pueden ser más largos
          # si son cohesivos — la señal aplica al hook que los orquesta).
          while IFS= read -r file; do
            lines=$(wc -l < "$file" | tr -d ' ')
            if [ "$lines" -gt "$MAX_LINES" ]; then
              echo "⚠️  $file tiene $lines líneas (límite sugerido: $MAX_LINES)"
              FOUND=$((FOUND + 1))
            fi
          done < <(find resources/js/pages -maxdepth 2 -iname "use*Page.ts")

          if [ "$FOUND" -gt 0 ]; then
            echo ""
            echo "Considera dividir en sub-hooks por dominio en la misma carpeta (CLAUDE.md: 'Cuándo dividir un hook')."
            # Warning, no bloquea el PR — es una señal, no todos los casos ameritan split inmediato.
          else
            echo "✅ Todos los hooks principales de página dentro del límite sugerido"
          fi
