name: CLAUDE.md Rules

# Solo las reglas críticas de CLAUDE.md (arquitectura y seguridad) y todas bloqueantes: si una falla, el PR no
# debe entrar. Las convenciones de estilo (tamaño de páginas/hooks, carpetas, enums literales, style inline,
# imports) las cubren Pint, ESLint y la revisión humana — no se vigilan aquí para no generar ruido.
#
# Para correr una regla en local, copia el bloque `run:` de su paso en la raíz del repositorio.

on:
  pull_request:
    branches: [main, develop]

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

  frontend-rules:
    name: Reglas de frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convenciones de nombres (models con I, services y hooks con use)
        run: |
          ERRORS=0

          while IFS= read -r file; do
            base=$(basename "$file")
            if [[ ! "$base" =~ ^I[A-Z] ]]; then
              echo "❌ models/$base debe tener prefijo I (ej: IOrder.ts)"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find resources/js/models -name "*.ts" -not -name "index.ts" 2>/dev/null)

          while IFS= read -r file; do
            base=$(basename "$file")
            if [[ ! "$base" =~ ^use ]]; then
              echo "❌ $file debe tener prefijo use (ej: useOrderService.ts)"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find resources/js/services resources/js/hooks -name "*.ts" -not -name "index.ts" 2>/dev/null)

          if [ $ERRORS -gt 0 ]; then
            echo "❌ $ERRORS violación(es) de convenciones de nombres (CLAUDE.md: Convenciones de nombres)"
            exit 1
          fi
          echo "✅ Convenciones de nombres correctas"

      - name: Sin peticiones HTTP directas en pages/ ni components/
        run: |
          ERRORS=0

          # Nunca importar axios: se usa useAxios() y la capa de servicios (services/*.ts).
          while IFS= read -r file; do
            if grep -qE "^import axios|from ['\"]axios['\"]" "$file" 2>/dev/null; then
              echo "❌ $file importa axios directamente (CLAUDE.md: peticiones http)"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find resources/js/pages resources/js/components \( -name "*.ts" -o -name "*.tsx" \) 2>/dev/null)

          # Tampoco llamadas crudas axiosGET/axiosPOST/... ni axiosApi.<método>() en hooks de páginas o componentes.
          while IFS= read -r file; do
            if grep -qE "axios(POST|PUT|DELETE|GET|PATCH)\(|axiosApi\.(get|post|put|delete|patch)\(" "$file" 2>/dev/null; then
              echo "❌ $file llama axios*() o axiosApi crudo. Muévelo a un hook en services/*.ts (CLAUDE.md: peticiones http)"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find resources/js/pages resources/js/components \( -name "*.ts" -o -name "*.tsx" \) 2>/dev/null)

          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi
          echo "✅ Sin peticiones HTTP directas"

      - name: Interfaces de dominio en models/ (no en pages/ ni components/)
        run: |
          ERRORS=0

          while IFS= read -r file; do
            count=$(grep -cE "^export interface I[A-Z]" "$file" 2>/dev/null || true)
            if [ "$count" -gt 0 ]; then
              echo "❌ $file define $count interfaz(ces) de dominio. Muévelas a models/ (CLAUDE.md: Tipos)"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find resources/js/pages resources/js/components \( -name "*.ts" -o -name "*.tsx" \) 2>/dev/null)

          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi
          echo "✅ Interfaces de dominio en models/"

      - name: Aislamiento de contextos (components/ por props; Context de página en la raíz de la página)
        run: |
          ERRORS=0

          # components/ es global y debe recibir todo por props: no puede importar el contexto de una página.
          while IFS= read -r file; do
            if grep -qE "from [\"'][^\"']*pages/[^\"']*Context[\"']" "$file" 2>/dev/null; then
              echo "❌ $file importa un contexto de página. components/ recibe todo por props (CLAUDE.md: Contextos)"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find resources/js/components \( -name "*.tsx" -o -name "*.ts" \) 2>/dev/null)

          # <Feature>Context.tsx vive junto al hook de la página, no dentro de partials/.
          while IFS= read -r file; do
            echo "❌ $file — un *Context.tsx de página debe vivir en pages/<Feature>/, no dentro de partials/"
            ERRORS=$((ERRORS + 1))
          done < <(find resources/js/pages -iname "*Context.tsx" -path "*/partials/*" 2>/dev/null)

          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi
          echo "✅ Contextos bien aislados"

      - name: Formularios con noValidate (la validación vive en Yup, no en el navegador)
        run: |
          ERRORS=0

          # Un <form> sin noValidate dispara el popup nativo en inglés del navegador y se salta los mensajes de
          # Yup/Formik (CLAUDE.md: Formularios).
          # Se cuentan los <form de código real (sin comentarios) y debe haber un noValidate por cada uno.
          while IFS= read -r file; do
            forms=$(grep -vE "^[[:space:]]*(//|\*|\{/\*)" "$file" | grep -cE "<form\b" || true)
            valid=$(grep -vE "^[[:space:]]*(//|\*|\{/\*)" "$file" | grep -c "noValidate" || true)
            if [ "$forms" -gt "$valid" ]; then
              echo "❌ $file tiene $forms <form> y solo $valid noValidate"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(grep -rlE "<form\b" resources/js --include="*.tsx" 2>/dev/null)

          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi
          echo "✅ Todos los formularios llevan noValidate"

  backend-rules:
    name: Reglas de backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sin DB::transaction en controladores ni servicios
        run: |
          # TransactionMiddleware ya envuelve toda request no-GET con reintento en deadlock; una transacción propia
          # solo crea un savepoint anidado que interfiere con ese reintento (CLAUDE.md: Controladores).
          MATCHES=$(grep -rnE "DB::transaction\(" app/Http/Controllers app/Services 2>/dev/null \
            | grep -vE "^[^:]+:[0-9]+:[[:space:]]*(\*|//|#)" || true)

          if [ -n "$MATCHES" ]; then
            echo "❌ DB::transaction() no se usa en controladores ni servicios (lo maneja TransactionMiddleware):"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ Sin DB::transaction propio"

      - name: env() solo en config/
        run: |
          # Fuera de config/*.php, env() deja de funcionar con `php artisan config:cache` (estándar en producción)
          # y falla en silencio (CLAUDE.md: env() solo en archivos de config). bootstrap/app.php queda fuera: corre antes de cargar la config.
          MATCHES=$(grep -rnE "\benv\(" app routes database 2>/dev/null \
            | grep -vE "^[^:]+:[0-9]+:[[:space:]]*(\*|//|#)" || true)

          if [ -n "$MATCHES" ]; then
            echo "❌ env() fuera de config/. Usa config('archivo.clave'):"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ env() solo en config/"

      - name: Sin ->utc() sobre rangos de fecha
        run: |
          # Las fechas en BD se guardan en hora local: convertir el rango a UTC desplaza la ventana de comparación
          # y da resultados incorrectos sin error visible (CLAUDE.md: Comparaciones de fecha/hora).
          MATCHES=$(grep -rnE "\->utc\(\)" app 2>/dev/null \
            | grep -vE "^[^:]+:[0-9]+:[[:space:]]*(\*|//|#)" || true)

          if [ -n "$MATCHES" ]; then
            echo "❌ ->utc() desplaza los rangos de fecha (la BD guarda hora local):"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ Sin ->utc()"

      - name: Validación en FormRequest, no inline en controladores
        run: |
          # Toda validación vive en app/Http/Requests/ (CLAUDE.md: Controladores).
          MATCHES=$(grep -rnE "\\\$(request|params)->validate\(|request\(\)->validate\(" app/Http/Controllers 2>/dev/null \
            | grep -vE "^[^:]+:[0-9]+:[[:space:]]*(\*|//|#)" || true)

          if [ -n "$MATCHES" ]; then
            echo "❌ Validación inline en un controlador. Crea un FormRequest en app/Http/Requests/:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ Validación en FormRequest"

      - name: Contrato de API (Response::success/error) en controladores
        run: |
          # Un JSON crudo rompe el contrato {status, message, data} y obliga al frontend a casos especiales
          # (CLAUDE.md: Contrato de respuesta de la API). Los middleware y ResponseMacros quedan fuera: ahí se define.
          MATCHES=$(grep -rnE "Response::json\(|response\(\)->json\(" app/Http/Controllers 2>/dev/null \
            | grep -vE "^[^:]+:[0-9]+:[[:space:]]*(\*|//|#)" || true)

          if [ -n "$MATCHES" ]; then
            echo "❌ JSON crudo en un controlador. Usa Response::success()/Response::error():"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ Contrato de API respetado"

      - name: Sin nombres de clase completos inline (usar use)
        run: |
          # Declara el `use` al inicio y referencia el nombre corto (CLAUDE.md: PHP — imports y referencias de clases).
          # Se ignoran comentarios/docblocks y las líneas namespace/use.
          MATCHES=$(grep -rnE "(^|[^A-Za-z0-9_\\'\"])\\\\[A-Z][A-Za-z]+(\\\\[A-Za-z]+)*(::|\(|[[:space:]]+\\\$)" app tests routes database --include="*.php" 2>/dev/null \
            | grep -vE "^[^:]+:[0-9]+:[[:space:]]*(\*|//|#|namespace |use )" || true)

          if [ -n "$MATCHES" ]; then
            echo "❌ Clase referenciada con namespace completo inline. Agrega el use y usa el nombre corto:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ Sin FQCN inline"
