[www]
; dynamic en vez de static: con pm=static los 4 workers estaban siempre arriba fijos, sin
; margen para absorber picos — dynamic los escala dentro de un techo según demanda real, sin
; comprometer más RAM de la necesaria en horas valle. El techo (max_children=10) es un ajuste
; conservador dentro de la instancia actual (apps-s-1vcpu-1gb); no resuelve la concurrencia de
; "cientos de usuarios" por sí solo — ver ESCALAMIENTO.md para las opciones que sí lo resuelven
; (instancia más grande + separar Reverb + Redis).
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Sin esto, una request colgada (query lenta, deadlock esperando lock) se queda el worker
; ocupado indefinidamente — nginx igual la corta a los 60s (fastcgi_read_timeout default) pero
; el worker de FPM nunca se libera hasta que el proceso PHP termine solo. request_terminate_timeout
; fuerza a FPM a matar el proceso y devolver el worker al pool.
request_terminate_timeout = 60s

; slowlog: cualquier request que tarde más de 5s queda registrada en stderr (Runtime Logs de
; DO) con el stack trace de en qué línea estaba atorada — la señal más directa de qué endpoint
; está saturando el pool de workers, antes de que se note como caída general.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s

; Logging
access.log = /dev/null
